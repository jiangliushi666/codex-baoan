<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex 保安</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="window-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="brand-block">
          <div class="brand-mark">保</div>
          <div>
            <h1>Codex 保安</h1>
            <p id="subtitleText">正在读取本机配置</p>
          </div>
        </div>
        <nav class="segmented" aria-label="视图切换">
          <button class="tab-button active" data-view="app" type="button">Codex</button>
          <button class="tab-button" data-view="ccswitch" type="button">ccswitch</button>
          <button class="tab-button" data-view="plus" type="button">Codex++</button>
          <button class="tab-button" data-view="logs" type="button">日志</button>
        </nav>
        <div class="toolbar">
          <button class="icon-button" id="refreshButton" title="重新扫描" type="button">↻</button>
          <button class="icon-button" id="settingsButton" title="备用设置" type="button">⚙</button>
          <button class="add-button" id="quickToggleButton" title="一键保护" type="button">+</button>
        </div>
      </header>

      <section class="status-line" id="statusLine">
        <div><strong id="guardState">未接管</strong><span id="guardDetail">正在扫描 ccswitch、Codex++ 和 Codex 配置</span></div>
        <div class="status-pills" id="sourcePills"></div>
      </section>

      <section class="view active" id="view-app">
        <div class="section-title"><h2>Codex 上游</h2><p id="providerSummary">优先使用自动发现的可用配置</p></div>
        <div class="switch-list" id="providerList"></div>
        <div class="switch-list compact-list">
          <article class="switch-row inspect-row">
            <div class="drag-handle" aria-hidden="true">⋮⋮</div><div class="row-icon inspect-icon">!</div>
            <div class="row-main"><div class="row-titleline"><h3>命令风险检查</h3><span class="soft-badge" id="inspectBadge">待检查</span></div><input id="commandInput" spellcheck="false" placeholder="粘贴一条命令，例如 Get-Content C:/Users/j/.ssh/id_rsa" /><p id="decisionText">检查风险级别、原因和命中的路径。</p></div>
            <button class="ghost-row-action" id="inspectButton" type="button">检查</button>
          </article>
        </div>
      </section>

      <section class="view" id="view-ccswitch"><div class="section-title"><h2>ccswitch 来源</h2><p>~/.cc-switch/cc-switch.db</p></div><div class="switch-list" id="ccswitchList"></div></section>
      <section class="view" id="view-plus"><div class="section-title"><h2>Codex++ / Codex</h2><p>默认读取本机设置文件</p></div><div class="switch-list" id="plusList"></div></section>
      <section class="view" id="view-logs"><div class="logs-shell"><div class="session-list" id="sessionList"></div><pre class="log-view" id="logView">暂无日志。启用保护后会显示最近会话。</pre></div></section>
    </main>

    <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
      <div class="settings-header"><h2>备用设置</h2><button class="icon-button" id="closeSettingsButton" type="button">×</button></div>
      <label class="field"><span>手动 Base URL</span><input id="upstreamInput" spellcheck="false" placeholder="仅在自动发现失败时填写" /></label>
      <label class="field"><span>手动 API Key</span><input id="apiKeyInput" spellcheck="false" type="password" placeholder="只用于本次启动" /></label>
      <label class="field"><span>本地端口</span><input id="portInput" inputmode="numeric" placeholder="8787" /></label>
      <label class="field"><span>模式</span><select id="modeSelect"><option value="audit">仅记录</option><option value="block">拦截高危</option></select></label>
      <label class="field"><span>额外允许目录</span><textarea id="allowInput" rows="4" placeholder="每行一个路径"></textarea></label>
      <label class="field"><span>Codex App 进程名</span><input id="processNamesInput" spellcheck="false" placeholder="codex, Codex, codex-app" /></label>
      <label class="check-row"><input id="killOnBlockInput" type="checkbox" /><span>检测到高危时尝试结束进程</span></label>
      <button class="settings-save" id="saveSettingsButton" type="button">保存</button>
      <div class="config-path"><span>配置文件</span><code id="configPath">Loading</code></div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/assets/app.js" type="module"></script>
  </body>
</html>
